<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="SEVEN — curiosity, astronomy, technology and creation.">

<title>SEVEN — Beyond the Ordinary</title>

<style>
/* =========================================================
   SEVEN // CORE
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap');

:root{
    --bg:#030303;
    --bg2:#080808;
    --red:#ff1738;
    --red2:#ff3652;
    --white:#f5f5f5;
    --muted:#8a8a8a;
    --line:rgba(255,255,255,.08);
    --glass:rgba(255,255,255,.035);
    --max:1200px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--white);
    font-family:Inter,sans-serif;
    overflow-x:hidden;
    cursor:none;
}

/* =========================================================
   LOADING SCREEN
   ========================================================= */

.loader{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 1s ease, visibility 1s ease;
}

.loader.hidden{
    opacity:0;
    visibility:hidden;
}

.loader-inner{
    text-align:center;
}

.loader-seven{
    font-family:Orbitron,sans-serif;
    font-size:clamp(5rem,18vw,12rem);
    font-weight:900;
    color:transparent;
    -webkit-text-stroke:1px var(--red);
    letter-spacing:-.08em;
    animation:pulse 1.5s infinite alternate;
}

.loader-text{
    color:#666;
    font-size:.65rem;
    letter-spacing:.45em;
    text-transform:uppercase;
}

.loader-line{
    width:160px;
    height:1px;
    background:#222;
    margin:25px auto 0;
    overflow:hidden;
}

.loader-line::after{
    content:"";
    display:block;
    width:50%;
    height:100%;
    background:var(--red);
    animation:loading 1.2s infinite;
}

@keyframes loading{
    from{transform:translateX(-100%)}
    to{transform:translateX(300%)}
}

@keyframes pulse{
    from{opacity:.35}
    to{opacity:1}
}

/* =========================================================
   CURSOR
   ========================================================= */

.cursor{
    position:fixed;
    width:8px;
    height:8px;
    background:var(--red);
    border-radius:50%;
    pointer-events:none;
    z-index:10000;
    transform:translate(-50%,-50%);
    box-shadow:0 0 20px var(--red);
}

.cursor-ring{
    position:fixed;
    width:38px;
    height:38px;
    border:1px solid rgba(255,23,56,.55);
    border-radius:50%;
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%);
    transition:
        width .25s ease,
        height .25s ease,
        border-color .25s ease;
}

body.hovering .cursor-ring{
    width:65px;
    height:65px;
    border-color:var(--red);
}

/* =========================================================
   BACKGROUND
   ========================================================= */

.space{
    position:fixed;
    inset:0;
    z-index:-5;
    background:
        radial-gradient(circle at 50% 20%,rgba(255,23,56,.10),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(255,0,50,.05),transparent 25%),
        #030303;
}

.grid{
    position:fixed;
    inset:-50%;
    z-index:-4;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:55px 55px;
    transform:perspective(600px) rotateX(65deg);
    transform-origin:center;
    mask-image:linear-gradient(to bottom,transparent,black 35%,black 65%,transparent);
}

.noise{
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
    opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}

/* =========================================================
   STARS
   ========================================================= */

.stars,
.stars::before,
.stars::after{
    position:fixed;
    inset:0;
    content:"";
    pointer-events:none;
    z-index:-3;
}

.stars{
    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px);
    background-size:130px 130px;
    opacity:.25;
    animation:starsMove 80s linear infinite;
}

.stars::before{
    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px);
    background-size:190px 190px;
    opacity:.4;
    animation:starsMove 120s linear reverse infinite;
}

.stars::after{
    background-image:
        radial-gradient(circle,var(--red) 1px,transparent 1px);
    background-size:270px 270px;
    opacity:.25;
}

@keyframes starsMove{
    to{transform:translateY(130px)}
}

/* =========================================================
   SHOOTING STAR
   ========================================================= */

.shooting-star{
    position:fixed;
    width:140px;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--red),transparent);
    transform:rotate(-35deg);
    opacity:0;
    pointer-events:none;
    z-index:-2;
    animation:shoot 8s linear infinite;
}

.shooting-star:nth-child(2){
    top:25%;
    left:80%;
    animation-delay:3s;
}

.shooting-star:nth-child(3){
    top:60%;
    left:30%;
    animation-delay:6s;
}

@keyframes shoot{
    0%{
        transform:translate(0,0) rotate(-35deg);
        opacity:0;
    }
    5%{opacity:1}
    15%{
        transform:translate(-500px,300px) rotate(-35deg);
        opacity:0;
    }
    100%{opacity:0}
}

/* =========================================================
   NAVIGATION
   ========================================================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:100;
    padding:25px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    backdrop-filter:blur(15px);
    background:rgba(3,3,3,.35);
    border-bottom:1px solid transparent;
    transition:.4s;
}

nav.scrolled{
    padding:16px 5%;
    background:rgba(3,3,3,.8);
    border-color:var(--line);
}

.logo{
    font-family:Orbitron,sans-serif;
    font-weight:900;
    letter-spacing:.15em;
    color:#fff;
    text-decoration:none;
}

.logo span{
    color:var(--red);
}

.nav-links{
    display:flex;
    gap:35px;
    list-style:none;
}

.nav-links a{
    color:#aaa;
    text-decoration:none;
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.18em;
    transition:.3s;
}

.nav-links a:hover{
    color:#fff;
}

/* =========================================================
   GENERAL
   ========================================================= */

section{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:120px 5%;
}

.container{
    width:100%;
    max-width:var(--max);
    margin:auto;
}

.section-label{
    font-family:Orbitron,sans-serif;
    color:var(--red);
    font-size:.65rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    margin-bottom:20px;
}

.section-title{
    font-family:Orbitron,sans-serif;
    font-size:clamp(2.2rem,6vw,5rem);
    line-height:1;
    letter-spacing:-.06em;
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
    min-height:100vh;
    overflow:hidden;
}

.hero-content{
    position:relative;
    z-index:3;
}

.hero-small{
    color:#777;
    font-size:.75rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    margin-bottom:25px;
}

.hero-title{
    position:relative;
    font-family:Orbitron,sans-serif;
    font-size:clamp(5rem,18vw,15rem);
    line-height:.78;
    letter-spacing:-.1em;
    font-weight:900;
    text-transform:uppercase;
    user-select:none;
}

.hero-title::before{
    content:"SEVEN";
    position:absolute;
    inset:0;
    color:transparent;
    -webkit-text-stroke:1px rgba(255,23,56,.25);
    transform:translate(10px,10px);
    z-index:-1;
}

.hero-title span{
    color:var(--red);
    text-shadow:
        0 0 30px rgba(255,23,56,.3),
        0 0 100px rgba(255,23,56,.1);
}

.hero-subtitle{
    margin-top:35px;
    max-width:560px;
    color:#999;
    font-size:1rem;
    line-height:1.8;
}

.typing{
    color:#ddd;
}

.hero-buttons{
    margin-top:40px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:150px;
    padding:15px 25px;
    border:1px solid var(--line);
    color:#fff;
    text-decoration:none;
    text-transform:uppercase;
    letter-spacing:.15em;
    font-size:.65rem;
    transition:.3s;
    position:relative;
    overflow:hidden;
}

.btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--red);
    transform:translateX(-105%);
    transition:.4s;
    z-index:-1;
}

.btn:hover::before{
    transform:translateX(0);
}

.btn:hover{
    border-color:var(--red);
    transform:translateY(-3px);
}

.btn.primary{
    background:var(--red);
    border-color:var(--red);
}

.btn.primary::before{
    background:#fff;
}

.btn.primary:hover{
    color:#000;
}

/* giant 7 */

.giant-seven{
    position:absolute;
    right:-5vw;
    bottom:-15vh;
    font-family:Orbitron,sans-serif;
    font-size:min(70vw,70rem);
    line-height:.7;
    font-weight:900;
    color:transparent;
    -webkit-text-stroke:1px rgba(255,255,255,.035);
    user-select:none;
    pointer-events:none;
}

/* =========================================================
   ORBIT
   ========================================================= */

.orbit-system{
    position:absolute;
    width:min(50vw,600px);
    aspect-ratio:1;
    right:5%;
    top:50%;
    transform:translateY(-50%);
    opacity:.8;
}

.orbit{
    position:absolute;
    inset:10%;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    animation:orbitRotate 20s linear infinite;
}

.orbit:nth-child(2){
    inset:20%;
    animation-duration:12s;
    animation-direction:reverse;
}

.orbit:nth-child(3){
    inset:32%;
    animation-duration:8s;
}

.orbit-core{
    position:absolute;
    width:22%;
    aspect-ratio:1;
    top:39%;
    left:39%;
    border-radius:50%;
    background:radial-gradient(circle,#ff5068 0,#ff1738 20%,rgba(255,23,56,.1) 65%,transparent 70%);
    box-shadow:0 0 80px rgba(255,23,56,.25);
}

.orbit-dot{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--red);
    top:0;
    left:50%;
    box-shadow:0 0 20px var(--red);
}

@keyframes orbitRotate{
    to{transform:rotate(360deg)}
}

/* =========================================================
   ABOUT
   ========================================================= */

.about-grid{
    display:grid;
    grid-template-columns:1fr 1.2fr;
    gap:100px;
    align-items:center;
}

.about-text{
    color:#999;
    line-height:1.9;
    font-size:1rem;
}

.about-text strong{
    color:#fff;
}

.about-card{
    border:1px solid var(--line);
    background:var(--glass);
    backdrop-filter:blur(20px);
    padding:45px;
    position:relative;
    overflow:hidden;
}

.about-card::before{
    content:"07";
    position:absolute;
    right:-20px;
    bottom:-70px;
    font-family:Orbitron,sans-serif;
    font-size:15rem;
    font-weight:900;
    color:transparent;
    -webkit-text-stroke:1px rgba(255,23,56,.08);
}

.status{
    display:flex;
    align-items:center;
    gap:10px;
    color:#aaa;
    font-size:.7rem;
    letter-spacing:.15em;
    text-transform:uppercase;
}

.status-dot{
    width:7px;
    height:7px;
    background:#ff1738;
    border-radius:50%;
    box-shadow:0 0 12px #ff1738;
    animation:blink 1.5s infinite;
}

@keyframes blink{
    50%{opacity:.2}
}

/* =========================================================
   INTERESTS
   ========================================================= */

.interests-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:70px;
}

.interest{
    min-height:280px;
    padding:35px;
    border:1px solid var(--line);
    background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.01));
    position:relative;
    overflow:hidden;
    transition:.4s;
}

.interest::after{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    border-radius:50%;
    background:var(--red);
    filter:blur(100px);
    opacity:0;
    right:-80px;
    bottom:-80px;
    transition:.5s;
}

.interest:hover{
    transform:translateY(-10px);
    border-color:rgba(255,23,56,.4);
}

.interest:hover::after{
    opacity:.25;
}

.interest-number{
    font-family:Orbitron,sans-serif;
    color:var(--red);
    font-size:.65rem;
    letter-spacing:.2em;
}

.interest h3{
    margin-top:60px;
    font-family:Orbitron,sans-serif;
    font-size:1.2rem;
}

.interest p{
    margin-top:15px;
    color:#777;
    line-height:1.7;
    font-size:.85rem;
}

/* =========================================================
   PHILOSOPHY
   ========================================================= */

.philosophy{
    text-align:center;
    overflow:hidden;
}

.philosophy::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:var(--red);
    filter:blur(180px);
    opacity:.08;
}

.quote{
    position:relative;
    max-width:950px;
    margin:auto;
    font-family:Orbitron,sans-serif;
    font-size:clamp(2rem,5vw,5rem);
    line-height:1.15;
    letter-spacing:-.05em;
}

.quote span{
    color:var(--red);
}

.quote-author{
    margin-top:35px;
    color:#555;
    font-size:.65rem;
    letter-spacing:.4em;
    text-transform:uppercase;
}

/* =========================================================
   STATS
   ========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
}

.stat{
    padding:50px 30px;
    text-align:center;
    border-right:1px solid var(--line);
}

.stat:last-child{
    border-right:0;
}

.stat-number{
    font-family:Orbitron,sans-serif;
    font-size:clamp(2.5rem,6vw,5rem);
    color:#fff;
}

.stat-label{
    margin-top:10px;
    color:#555;
    text-transform:uppercase;
    letter-spacing:.2em;
    font-size:.6rem;
}

/* =========================================================
   FINAL
   ========================================================= */

.final{
    min-height:80vh;
    text-align:center;
}

.final-title{
    font-family:Orbitron,sans-serif;
    font-size:clamp(3rem,9vw,9rem);
    letter-spacing:-.08em;
    line-height:.85;
}

.final-title span{
    color:var(--red);
}

.final p{
    color:#777;
    margin:35px auto;
    max-width:500px;
    line-height:1.8;
}

/* =========================================================
   FOOTER
   ========================================================= */

footer{
    padding:30px 5%;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    color:#444;
    font-size:.6rem;
    letter-spacing:.15em;
    text-transform:uppercase;
}

footer span{
    color:var(--red);
}

/* =========================================================
   SCROLL REVEAL
   ========================================================= */

.reveal{
    opacity:0;
    transform:translateY(40px);
    transition:1s cubic-bezier(.16,1,.3,1);
}

.reveal.active{
    opacity:1;
    transform:translateY(0);
}

/* =========================================================
   GLITCH
   ========================================================= */

.glitch{
    animation:glitch 5s infinite;
}

@keyframes glitch{
    0%,94%,100%{
        transform:translate(0);
    }
    95%{
        transform:translate(-2px,1px);
    }
    96%{
        transform:translate(2px,-1px);
    }
    97%{
        transform:translate(-1px,0);
    }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:800px){

    body{
        cursor:auto;
    }

    .cursor,
    .cursor-ring{
        display:none;
    }

    nav{
        padding:20px;
    }

    .nav-links{
        display:none;
    }

    section{
        padding:100px 7%;
    }

    .hero{
        align-items:center;
    }

    .hero-title{
        font-size:clamp(4.5rem,22vw,9rem);
    }

    .hero-subtitle{
        font-size:.9rem;
    }

    .orbit-system{
        opacity:.2;
        width:90vw;
        right:-25vw;
    }

    .giant-seven{
        font-size:120vw;
        right:-30vw;
        bottom:-5vh;
    }

    .about-grid{
        grid-template-columns:1fr;
        gap:40px;
    }

    .interests-grid{
        grid-template-columns:1fr;
        margin-top:40px;
    }

    .interest{
        min-height:230px;
    }

    .interest h3{
        margin-top:40px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .stat{
        border-right:0;
        border-bottom:1px solid var(--line);
    }

    .stat:last-child{
        border-bottom:0;
    }

    footer{
        flex-direction:column;
        gap:12px;
        text-align:center;
    }
}
</style>
</head>

<body>

<!-- LOADING -->
<div class="loader" id="loader">
    <div class="loader-inner">
        <div class="loader-seven">7</div>
        <div class="loader-text">Initializing Seven</div>
        <div class="loader-line"></div>
    </div>
</div>

<!-- BACKGROUND -->
<div class="space"></div>
<div class="stars"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="grid"></div>
<div class="noise"></div>

<!-- CURSOR -->
<div class="cursor"></div>
<div class="cursor-ring"></div>

<!-- NAV -->
<nav id="nav">
    <a href="#home" class="logo">SE<span>V</span>EN</a>

    <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#interests">Interests</a></li>
        <li><a href="#philosophy">Philosophy</a></li>
    </ul>
</nav>

<!-- HERO -->
<section class="hero" id="home">

    <div class="container hero-content reveal">

        <div class="hero-small">
            07 // SYSTEM ONLINE
        </div>

        <h1 class="hero-title glitch">
            SE<span>V</span>EN
        </h1>

        <p class="hero-subtitle">
            A curious mind exploring
            <span class="typing" id="typing"></span>
        </p>

        <div class="hero-buttons">
            <a href="#about" class="btn primary magnetic">Explore</a>
            <a href="#philosophy" class="btn magnetic">Enter the unknown</a>
        </div>

    </div>

    <div class="giant-seven" id="giantSeven">
        7
    </div>

    <div class="orbit-system" id="orbit">
        <div class="orbit">
            <div class="orbit-dot"></div>
        </div>

        <div class="orbit">
            <div class="orbit-dot"></div>
        </div>

        <div class="orbit">
            <div class="orbit-dot"></div>
        </div>

        <div class="orbit-core"></div>
    </div>

</section>

<!-- ABOUT -->
<section id="about">

    <div class="container">

        <div class="about-grid">

            <div class="reveal">

                <div class="section-label">
                    01 // Identity
                </div>

                <h2 class="section-title">
                    Not here<br>
                    to stay<br>
                    ordinary.
